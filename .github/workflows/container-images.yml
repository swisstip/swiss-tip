# Build the generic container images on one runner, test them, and push them
# to GitHub Container Registry. Started by hand; choose which images:
#
#   all       basic, semantic, the embedding sidecar and OpenCode, in that order
#   mcp       the basic image only
#   semantic  the semantic image only, on the basic image in ghcr.io
#   ollama    the embedding sidecar only, out of the semantic image in ghcr.io
#   opencode  the OpenCode image, which holds the agent and its web interface only
#
# These are the images that hold no knowledge release. The images that hold
# one are built, tested and pushed by the workflow of the same name in the
# packs repository, swisstip/swiss-tip-mvp, on the images pushed here: a
# pack image on the semantic image, a slim release image (docker/slim, the
# Dockerfile is here, its build is there) on the basic image and tested
# beside the sidecar, and the demo image on a pack image. So a run here comes
# first, with push, and a new swisstip-mcp version means a run here and then
# a run there.
#
# No test reads a pack: the release served is the synthetic test release of
# apps/mcp-server/tests/fixtures with a test readiness record
# (scripts/test/container/synthetic_pack.py). The basic image passes the
# round trip of the package build (scripts/test/mcp/check_wheel.py --url)
# with that release mounted. The semantic image is built, which pulls the
# model and checks its digest. The sidecar on its own must report healthy,
# which means the model is loaded.
#
# The OpenCode image is a test image: the agent and web interface of a
# pack's demo image without a server, a release or a model, for the profile
# "demo" of compose.yaml or a server elsewhere. It is tested as that profile
# runs it, beside the basic image of the same run or of ghcr.io with the
# synthetic release mounted (scripts/test/container/compose.synthetic.yaml),
# and pushed as swiss-tip-opencode with the OpenCode version and latest: it
# holds no release, so a new release does not change it.
#
# An image built earlier in the same run is used as the base directly, so a
# run without push also works for "all". An image not selected is pulled from
# ghcr.io and must have been pushed before. Every image is pushed only after
# all of them are built and tested.
#
# The basic image is pushed as ghcr.io/<owner>/swiss-tip-mcp with the tags
# <version> and latest, the semantic image as swiss-tip-semantic:<version>.
# The sidecar is pushed as ghcr.io/<owner>/swiss-tip-ollama with the tags
# <model> and <model>-<first 12 hex digits of the model digest>, the model
# tag written with a hyphen (qwen3-embedding-0.6b). Every image carries this
# repository's commit as org.opencontainers.image.revision.
name: Container images

on:
  workflow_dispatch:
    inputs:
      images:
        description: Images to build
        type: choice
        options: [all, mcp, semantic, ollama, opencode]
        default: all
      swisstip_mcp_version:
        description: swisstip-mcp version from PyPI (the basic and semantic image tag)
        type: string
        default: 0.2.5
      push:
        description: Push the tested images to ghcr.io
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: container-images
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    env:
      IMAGES: ${{ inputs.images }}
      VERSION: ${{ inputs.swisstip_mcp_version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Select images
        run: |
          mcp=0; semantic=0; sidecar=0; opencode=0
          case "$IMAGES" in
            all)      mcp=1; semantic=1; sidecar=1; opencode=1 ;;
            mcp)      mcp=1 ;;
            semantic) semantic=1 ;;
            ollama)   sidecar=1 ;;
            opencode) opencode=1 ;;
            *) echo "unknown selection $IMAGES"; exit 1 ;;
          esac
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "BUILD_MCP=$mcp"
            echo "BUILD_SEMANTIC=$semantic"
            echo "BUILD_SIDECAR=$sidecar"
            echo "BUILD_OPENCODE=$opencode"
            echo "REGISTRY=$registry"
            echo "MCP_IMAGE=$registry/swiss-tip-mcp"
            echo "SEMANTIC_IMAGE=$registry/swiss-tip-semantic"
            echo "SIDECAR_IMAGE=$registry/swiss-tip-ollama"
            echo "OPENCODE_IMAGE=$registry/swiss-tip-opencode"
            echo "SYNTHETIC_PACK=$RUNNER_TEMP/synthetic"
          } >> "$GITHUB_ENV"
          echo "basic=$mcp semantic=$semantic sidecar=$sidecar opencode=$opencode version=$VERSION registry=$registry"

      # The check client, and the synthetic release the images are tested on: no test here reads a pack.
      - name: Install the check client and write the synthetic pack
        run: |
          python -m pip install "swisstip-mcp==$VERSION"
          python scripts/test/container/synthetic_pack.py --out "$SYNTHETIC_PACK"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and test the basic image
        if: env.BUILD_MCP == '1'
        run: |
          docker build -f docker/mcp/Dockerfile --build-arg SWISSTIP_MCP_VERSION="$VERSION" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t "$MCP_IMAGE:$VERSION" -t "$MCP_IMAGE:latest" .
          docker run -d --name basic -p 8001:8000 -v "$SYNTHETIC_PACK:/srv/swiss-tip:ro" "$MCP_IMAGE:$VERSION"
          for attempt in $(seq 1 30); do curl -fs -o /dev/null http://127.0.0.1:8001/health && break; sleep 1; done
          # The image serves with --require-ready, so an answer means the readiness record was accepted.
          python scripts/test/mcp/check_wheel.py --url http://127.0.0.1:8001/mcp || { docker logs basic | tail -40; exit 1; }
          docker rm -f basic
          echo "$MCP_IMAGE:$VERSION $MCP_IMAGE:latest" >> "$RUNNER_TEMP/push.txt"

      - name: Build the semantic image
        if: env.BUILD_SEMANTIC == '1'
        run: |
          docker build --build-arg BASE_IMAGE="$MCP_IMAGE:$VERSION" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t "$SEMANTIC_IMAGE:$VERSION" docker/semantic
          echo "$SEMANTIC_IMAGE:$VERSION" >> "$RUNNER_TEMP/push.txt"

      - name: Build and test the embedding sidecar
        if: env.BUILD_SIDECAR == '1'
        run: |
          # Ollama and the model are copied out of the semantic image of this run, or of ghcr.io; the build
          # itself fails unless the copied model has the expected digest and loads.
          docker build --build-arg SEMANTIC_IMAGE="$SEMANTIC_IMAGE:$VERSION" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t sidecar:build docker/ollama
          model=$(docker image inspect --format '{{ index .Config.Labels "swiss-tip.embedding.model" }}' sidecar:build)
          digest=$(docker image inspect --format '{{ index .Config.Labels "swiss-tip.embedding.model-digest" }}' sidecar:build)
          # qwen3-embedding:0.6b is tagged qwen3-embedding-0.6b, the tag compose.yaml names, and with the model digest.
          tags="$SIDECAR_IMAGE:${model//:/-} $SIDECAR_IMAGE:${model//:/-}-${digest:0:12}"
          for tag in $tags; do docker tag sidecar:build "$tag"; done
          # On its own it must report healthy, which means the model is loaded.
          docker run -d --name sidecar sidecar:build
          for attempt in $(seq 1 90); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' sidecar)" = healthy ] && break; sleep 1
          done
          if [ "$(docker inspect --format '{{.State.Health.Status}}' sidecar)" != healthy ]; then docker logs sidecar | tail -40; exit 1; fi
          docker rm -f sidecar
          echo "$tags" >> "$RUNNER_TEMP/push.txt"

      - name: Build and test the OpenCode image
        if: env.BUILD_OPENCODE == '1'
        run: |
          # The context is the repository root, for LICENSE and NOTICE. The tag is the OpenCode version: the image
          # holds no release, so a new release does not change it.
          docker build -f docker/opencode/Dockerfile \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t opencode:build .
          version=$(docker image inspect --format '{{ index .Config.Labels "swiss-tip.demo.opencode.version" }}' opencode:build)
          [ -n "$version" ] || { echo "the image carries no swiss-tip.demo.opencode.version label to take its tag from"; exit 1; }
          tags="$OPENCODE_IMAGE:$version $OPENCODE_IMAGE:latest"
          for tag in $tags; do docker tag opencode:build "$tag"; done
          # Tested as compose.yaml runs it, the profile "demo" beside the server, with the server replaced by the
          # basic image of this run, or the one pushed before, on the synthetic release. The panel of this image is
          # generic and carries no sample questions.
          compose() { docker compose -f compose.yaml -f scripts/test/container/compose.synthetic.yaml "$@"; }
          export SWISSTIP_REGISTRY="$REGISTRY" SWISSTIP_PACK=synthetic SWISSTIP_PORT=8190 SWISSTIP_DEMO_PORT=4210
          export SWISSTIP_TEST_SERVER_IMAGE="$MCP_IMAGE:$VERSION" SWISSTIP_TEST_PACK_DIR="$SYNTHETIC_PACK"
          compose up -d --wait swiss-tip || { compose logs | tail -60; exit 1; }
          server=$(docker inspect --format '{{.State.StartedAt}}' "$(compose ps -q swiss-tip)")
          compose --profile demo up -d --wait swiss-tip demo || { compose --profile demo logs | tail -60; exit 1; }
          python docker/opencode/check_interface.py --url http://127.0.0.1:4210 --questions none
          # With a password the interface is recreated: 401 without credentials, the routes with them.
          OPENCODE_SERVER_PASSWORD=workflow-check compose --profile demo up -d --wait swiss-tip demo \
            || { compose --profile demo logs | tail -60; exit 1; }
          python docker/opencode/check_interface.py --url http://127.0.0.1:4210 --password workflow-check --questions none
          # Switching the interface on, and recreating it, leaves the server's container alone.
          if [ "$(docker inspect --format '{{.State.StartedAt}}' "$(compose ps -q swiss-tip)")" != "$server" ]; then
            echo "the server was restarted by the demo profile"; exit 1
          fi
          compose --profile demo down
          echo "$tags" >> "$RUNNER_TEMP/push.txt"

      - name: Push the tested images
        if: inputs.push
        run: |
          for tag in $(cat "$RUNNER_TEMP/push.txt"); do
            docker push "$tag"
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "### Container images"
            echo
            echo "Selection \`$IMAGES\`, swisstip-mcp \`$VERSION\`, pushed: \`${{ inputs.push }}\`"
            echo
            if [ -f "$RUNNER_TEMP/push.txt" ]; then
              echo "Built and tested:"
              tr ' ' '\n' < "$RUNNER_TEMP/push.txt" | sed 's/^/- `/; s/$/`/'
            else
              echo "No image was built and tested."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
