# Build the generic container images on one runner, test them, and push them
# to GitHub Container Registry. Started by hand; choose which images:
#
#   all       both MCP images, the embedding sidecar and OpenCode, in that order
#   mcp-slim  the MCP image without Ollama and the model only
#   mcp       the MCP image only, on the slim one in ghcr.io
#   ollama    the embedding sidecar only, out of the MCP image in ghcr.io
#   opencode  the OpenCode image, which holds the agent and its web interface only
#   calendar  the calendar connector image, swisstip-calendar-connector without a dataset
#
# These are the images that hold no knowledge release. The images that hold
# one are built, tested and pushed by the workflow of the same name in the
# packs repository, swisstip/swiss-tip-mvp, on the images pushed here: a
# pack image on the MCP image, a slim release image (docker/slim, the
# Dockerfile is here, its build is there) on the slim MCP image and tested
# beside the sidecar, and the demo image on a pack image. So a run here comes
# first, with push, and a new swisstip-mcp version means a run here and then
# a run there.
#
# No test reads a pack: the release served is the synthetic test release of
# apps/mcp-server/tests/fixtures with a test readiness record
# (scripts/test/container/synthetic_pack.py). The slim MCP image passes the
# round trip of the package build (scripts/test/mcp/check_wheel.py --url)
# with that release mounted. The MCP image is built, which pulls the
# model and checks its digest. The sidecar on its own must report healthy,
# which means the model is loaded.
#
# The OpenCode image is a test image: the agent and web interface of a
# pack's demo image without a server, a release or a model, for the profile
# "demo" of compose.yaml or a server elsewhere. It is tested as that profile
# runs it, beside the slim MCP image of the same run or of ghcr.io with the
# synthetic release mounted (scripts/test/container/compose.synthetic.yaml),
# and pushed as swiss-tip-opencode with the OpenCode version and latest: it
# holds no release, so a new release does not change it.
#
# An image built earlier in the same run is used as the base directly, so a
# run without push also works for "all". An image not selected is pulled from
# ghcr.io and must have been pushed before. Every image is pushed only after
# all of them are built and tested.
#
# A version that is not on PyPI yet is rehearsed with package_index:
# testpypi, which takes swisstip-mcp from TestPyPI with PyPI behind it for
# the dependencies. The packs repository then builds on the rehearsed tag by
# naming the same version.
#
# Two rules keep a rehearsal away from what a plain pull gets, both decided
# by the branch the run was started from ("Use workflow from"):
#
#   - the default branch builds from PyPI only. package_index: testpypi ends
#     the run there with an error, so nothing on it is ever built from a
#     package that no tag published;
#   - latest is pushed from the default branch only, and then only from PyPI
#     and for a final version (digits and dots, so not 0.3.0rc1). Every other
#     run pushes its version tags and leaves latest where it is.
#
# That second rule is about the images that carry a swisstip package, whose
# latest tag says "the current release". The OpenCode image carries none, and
# no release: package_index never reaches its build and the version above
# neither tags it nor enters it. Its latest tag is a moving pointer to a test
# image, like the sidecar's model tag, so it is pushed from every branch and
# compose.yaml, which names it, can always pull it. Only a tested image is
# pushed, here as everywhere.
#
# Both MCP images are one package, ghcr.io/<owner>/swiss-tip-mcp, as the pack
# and slim release images are one package in the packs repository: the image
# with Ollama and the model carries <version> and, under the rule above,
# latest, and the one without carries the same tags with -slim after them.
# The sidecar is pushed as ghcr.io/<owner>/swiss-tip-ollama with the tags
# <model> and <model>-<first 12 hex digits of the model digest>, the model
# tag written with a hyphen (qwen3-embedding-0.6b). Every image carries this
# repository's commit as org.opencontainers.image.revision.
name: Container images

on:
  workflow_dispatch:
    inputs:
      images:
        description: Images to build
        type: choice
        options: [all, mcp-slim, mcp, ollama, opencode, calendar]
        default: all
      swisstip_mcp_version:
        description: swisstip-mcp version (the tag of both MCP images and of the calendar connector image)
        type: string
        default: 0.4.0
      package_index:
        description: Index to take swisstip-mcp from; testpypi rehearses a version that is not released yet
        type: choice
        options: [pypi, testpypi]
        default: pypi
      push:
        description: Push the tested images to ghcr.io
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

concurrency:
  group: container-images
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    env:
      IMAGES: ${{ inputs.images }}
      VERSION: ${{ inputs.swisstip_mcp_version }}
      PACKAGE_INDEX: ${{ inputs.package_index }}
      REF_NAME: ${{ github.ref_name }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Select images
        run: |
          slim=0; mcp=0; sidecar=0; opencode=0; calendar=0
          case "$IMAGES" in
            all)      slim=1; mcp=1; sidecar=1; opencode=1; calendar=1 ;;
            mcp-slim) slim=1 ;;
            mcp)      mcp=1 ;;
            ollama)   sidecar=1 ;;
            opencode) opencode=1 ;;
            calendar) calendar=1 ;;
            *) echo "unknown selection $IMAGES"; exit 1 ;;
          esac
          # A rehearsal takes swisstip-mcp from TestPyPI, with PyPI behind it for the dependencies.
          case "$PACKAGE_INDEX" in
            pypi)     index="" ;;
            testpypi) index="https://test.pypi.org/simple/" ;;
            *) echo "unknown package index $PACKAGE_INDEX"; exit 1 ;;
          esac
          # The default branch builds releases and nothing else, so a rehearsal belongs on another branch.
          if [ -n "$index" ] && [ "$REF_NAME" = "$DEFAULT_BRANCH" ]; then
            echo "::error::$DEFAULT_BRANCH builds from PyPI only; run package_index testpypi from another branch"
            exit 1
          fi
          # latest is what a pull without a tag gets, so it names a release: the default branch, from PyPI, and a
          # final version (digits and dots; 0.3.0rc1 and 0.3.0.dev0 are not).
          latest=0
          if [ "$REF_NAME" = "$DEFAULT_BRANCH" ] && [ -z "$index" ]; then
            case "$VERSION" in *[!0-9.]*) ;; *) latest=1 ;; esac
          fi
          registry="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          {
            echo "INDEX_URL=$index"
            echo "PUSH_LATEST=$latest"
            echo "BUILD_MCP_SLIM=$slim"
            echo "BUILD_MCP=$mcp"
            echo "BUILD_SIDECAR=$sidecar"
            echo "BUILD_OPENCODE=$opencode"
            echo "BUILD_CALENDAR=$calendar"
            echo "REGISTRY=$registry"
            echo "MCP_IMAGE=$registry/swiss-tip-mcp"
            echo "SIDECAR_IMAGE=$registry/swiss-tip-ollama"
            echo "OPENCODE_IMAGE=$registry/swiss-tip-opencode"
            echo "CALENDAR_IMAGE=$registry/swiss-tip-calendar-connector"
            echo "SYNTHETIC_PACK=$RUNNER_TEMP/synthetic"
          } >> "$GITHUB_ENV"
          echo "slim=$slim mcp=$mcp sidecar=$sidecar opencode=$opencode calendar=$calendar version=$VERSION registry=$registry"
          echo "index=$PACKAGE_INDEX ${index:-https://pypi.org/simple/}, branch $REF_NAME of $DEFAULT_BRANCH, latest pushed: $latest"

      # The check client, and the synthetic release the images are tested on: no test here reads a pack.
      - name: Install the check client and write the synthetic pack
        run: |
          python -m pip install ${INDEX_URL:+--index-url "$INDEX_URL" --extra-index-url https://pypi.org/simple/} \
            "swisstip-mcp==$VERSION"
          python scripts/test/container/synthetic_pack.py --out "$SYNTHETIC_PACK"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and test the slim MCP image
        if: env.BUILD_MCP_SLIM == '1'
        run: |
          tags="$MCP_IMAGE:$VERSION-slim"
          if [ "$PUSH_LATEST" = 1 ]; then tags="$tags $MCP_IMAGE:latest-slim"; fi
          tag_args=""; for tag in $tags; do tag_args="$tag_args -t $tag"; done
          docker build -f docker/mcp-slim/Dockerfile --build-arg SWISSTIP_MCP_VERSION="$VERSION" \
            --build-arg PACKAGE_INDEX="$INDEX_URL" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            $tag_args .
          docker run -d --name slim -p 8001:8000 -v "$SYNTHETIC_PACK:/srv/swiss-tip:ro" "$MCP_IMAGE:$VERSION-slim"
          for attempt in $(seq 1 30); do curl -fs -o /dev/null http://127.0.0.1:8001/health && break; sleep 1; done
          # The image serves with --require-ready, so an answer means the readiness record was accepted.
          python scripts/test/mcp/check_wheel.py --url http://127.0.0.1:8001/mcp || { docker logs slim | tail -40; exit 1; }
          docker rm -f slim
          echo "$tags" >> "$RUNNER_TEMP/push.txt"

      - name: Build the MCP image
        if: env.BUILD_MCP == '1'
        run: |
          tags="$MCP_IMAGE:$VERSION"
          if [ "$PUSH_LATEST" = 1 ]; then tags="$tags $MCP_IMAGE:latest"; fi
          tag_args=""; for tag in $tags; do tag_args="$tag_args -t $tag"; done
          docker build --build-arg BASE_IMAGE="$MCP_IMAGE:$VERSION-slim" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            $tag_args docker/mcp
          echo "$tags" >> "$RUNNER_TEMP/push.txt"

      - name: Build and test the embedding sidecar
        if: env.BUILD_SIDECAR == '1'
        run: |
          # Ollama and the model are copied out of the MCP image of this run, or of ghcr.io; the build
          # itself fails unless the copied model has the expected digest and loads.
          docker build --build-arg MCP_IMAGE="$MCP_IMAGE:$VERSION" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t sidecar:build docker/ollama
          model=$(docker image inspect --format '{{ index .Config.Labels "swiss-tip.embedding.model" }}' sidecar:build)
          digest=$(docker image inspect --format '{{ index .Config.Labels "swiss-tip.embedding.model-digest" }}' sidecar:build)
          # qwen3-embedding:0.6b is tagged qwen3-embedding-0.6b, the tag compose.yaml names, and with the model digest.
          tags="$SIDECAR_IMAGE:${model//:/-} $SIDECAR_IMAGE:${model//:/-}-${digest:0:12}"
          for tag in $tags; do docker tag sidecar:build "$tag"; done
          # On its own it must report healthy, which means the model is loaded.
          docker run -d --name sidecar sidecar:build
          for attempt in $(seq 1 90); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' sidecar)" = healthy ] && break; sleep 1
          done
          if [ "$(docker inspect --format '{{.State.Health.Status}}' sidecar)" != healthy ]; then docker logs sidecar | tail -40; exit 1; fi
          docker rm -f sidecar
          echo "$tags" >> "$RUNNER_TEMP/push.txt"

      - name: Build and test the OpenCode image
        if: env.BUILD_OPENCODE == '1'
        run: |
          # The context is the repository root, for LICENSE and NOTICE. The tag is the OpenCode version: the image
          # holds no release, so a new release does not change it.
          docker build -f docker/opencode/Dockerfile \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t opencode:build .
          version=$(docker image inspect --format '{{ index .Config.Labels "swiss-tip.demo.opencode.version" }}' opencode:build)
          [ -n "$version" ] || { echo "the image carries no swiss-tip.demo.opencode.version label to take its tag from"; exit 1; }
          # This image holds no release and no swisstip package, so its latest tag is no release pointer and
          # the branch rule does not apply to it: compose.yaml names it, and the test below needs it too.
          docker tag opencode:build "$OPENCODE_IMAGE:$version"
          docker tag opencode:build "$OPENCODE_IMAGE:latest"
          tags="$OPENCODE_IMAGE:$version $OPENCODE_IMAGE:latest"
          # Tested as compose.yaml runs it, the profile "demo" beside the server, with the server replaced by the
          # slim MCP image of this run, or the one pushed before, on the synthetic release. The panel of this image is
          # generic and carries no sample questions.
          compose() { docker compose -f compose.yaml -f scripts/test/container/compose.synthetic.yaml "$@"; }
          export SWISSTIP_REGISTRY="$REGISTRY" SWISSTIP_PACK=synthetic SWISSTIP_PORT=8190 SWISSTIP_DEMO_PORT=4210
          export SWISSTIP_TEST_SERVER_IMAGE="$MCP_IMAGE:$VERSION-slim" SWISSTIP_TEST_PACK_DIR="$SYNTHETIC_PACK"
          compose up -d --wait swiss-tip || { compose logs | tail -60; exit 1; }
          server=$(docker inspect --format '{{.State.StartedAt}}' "$(compose ps -q swiss-tip)")
          compose --profile demo up -d --wait swiss-tip demo || { compose --profile demo logs | tail -60; exit 1; }
          python docker/opencode/check_interface.py --url http://127.0.0.1:4210 --questions none
          # With a password the interface is recreated: 401 without credentials, the routes with them.
          OPENCODE_SERVER_PASSWORD=workflow-check compose --profile demo up -d --wait swiss-tip demo \
            || { compose --profile demo logs | tail -60; exit 1; }
          python docker/opencode/check_interface.py --url http://127.0.0.1:4210 --password workflow-check --questions none
          # Switching the interface on, and recreating it, leaves the server's container alone.
          if [ "$(docker inspect --format '{{.State.StartedAt}}' "$(compose ps -q swiss-tip)")" != "$server" ]; then
            echo "the server was restarted by the demo profile"; exit 1
          fi
          compose --profile demo down
          echo "$tags" >> "$RUNNER_TEMP/push.txt"

      - name: Build and test the calendar connector image
        if: env.BUILD_CALENDAR == '1'
        run: |
          # The connector image carries the swisstip package of this version and no dataset, so its tags follow
          # the MCP image's rule. It is tested with the synthetic bundle of the app's tests mounted and the
          # conformance test of the connector contract run against it.
          tags="$CALENDAR_IMAGE:$VERSION"
          if [ "$PUSH_LATEST" = 1 ]; then tags="$tags $CALENDAR_IMAGE:latest"; fi
          tag_args=""; for tag in $tags; do tag_args="$tag_args -t $tag"; done
          docker build -f docker/calendar-connector/Dockerfile --build-arg SWISSTIP_VERSION="$VERSION" \
            --build-arg PACKAGE_INDEX="$INDEX_URL" \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            $tag_args .
          docker run -d --name calendar -p 8101:8100 \
            -v "$PWD/apps/calendar-connector/tests/fixtures:/srv/swiss-tip/datasets:ro" "$CALENDAR_IMAGE:$VERSION"
          for attempt in $(seq 1 30); do curl -fs -o /dev/null http://127.0.0.1:8101/health && break; sleep 1; done
          python scripts/test/connector/check_connector.py --url http://127.0.0.1:8101 || { docker logs calendar | tail -40; exit 1; }
          docker rm -f calendar
          echo "$tags" >> "$RUNNER_TEMP/push.txt"

      - name: Push the tested images
        if: inputs.push
        run: |
          for tag in $(cat "$RUNNER_TEMP/push.txt"); do
            docker push "$tag"
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "### Container images"
            echo
            echo "Selection \`$IMAGES\`, swisstip-mcp \`$VERSION\` from \`$PACKAGE_INDEX\`, pushed: \`${{ inputs.push }}\`"
            echo
            if [ -f "$RUNNER_TEMP/push.txt" ]; then
              echo "Built and tested:"
              tr ' ' '\n' < "$RUNNER_TEMP/push.txt" | sed 's/^/- `/; s/$/`/'
            else
              echo "No image was built and tested."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
