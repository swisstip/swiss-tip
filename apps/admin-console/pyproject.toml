[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swisstip-admin-console"
version = "0.3.0"
description = "Swiss TIP admin console: a local web interface over the pack files the pipeline reads and writes"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "jinja2>=3.1,<4",
    "python-multipart>=0.0.20,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.11,<3",
    "PyYAML>=6,<7",
    "swisstip-core",
    "swisstip-ingestion",
    "swisstip-extraction",
    "swisstip-build",
    "swisstip-runtime",
    "swisstip-knowledge-builder",
]

[project.optional-dependencies]
test = ["httpx>=0.27,<1"]

[project.scripts]
swisstip-admin = "swisstip.admin_console.app:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.package-data]
"swisstip.admin_console" = ["views/*.html", "views/**/*.html", "static/*"]
