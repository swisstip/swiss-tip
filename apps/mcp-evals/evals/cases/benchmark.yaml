cases:
  - case_id: W-UAT-1
    category: simple
    difficulty: standard
    question: I am moving from Munich to Wallisellen on 6 October 2026. The website has eUmzug, so I can do everything online, correct? When must I report the move?
    expected_answer: Moving to Wallisellen from abroad requires in-person registration at the population-services counter. The move must be reported within 14 days, so a 6 October 2026 move must be reported by 20 October 2026.
    expected_claims:
      - Moving to Wallisellen from abroad requires in-person registration.
      - The move must be reported within 14 days.
      - A move on 6 October 2026 must be reported by 20 October 2026.
    required_citations:
      - https://www.wallisellen.ch/umzug
    expected_tools: [search, resolve]
    must_not_claim:
      - The move can be completed entirely online.