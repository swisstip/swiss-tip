[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swisstip-core"
version = "0.3.0"
description = "Swiss TIP knowledge release format: Pydantic models and the release validator"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.11,<3",
]

[project.scripts]
swisstip-validate-release = "swisstip.core.validation:main"

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
