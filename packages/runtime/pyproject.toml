[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "swisstip-runtime"
version = "0.3.1"
description = "Swiss TIP runtime: the four tool operations over a validated knowledge release"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.12,<3",
    "swisstip-core",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true
